[package]
name = "acaua"
version = "0.1.0"
description = "Acauã — Sistema de Gestão Clínica Offline e Criptografado"
authors = ["Luiz"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0-rc", features = [] }

[dependencies]
tauri = { version = "2.0.0-rc", features = [] }
tauri-plugin-shell = "2.0.0-rc"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.31.0", features = ["bundled-sqlcipher"] }
r2d2 = "0.8"
lazy_static = "1.4"
aes-gcm = "0.10" # Caso precise de alguma criptografia adicional na memória
rand = "0.8"
rfd = "0.14"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
